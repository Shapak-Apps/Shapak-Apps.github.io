    <!-- tema flaşyny aýyrmak üçin: CSS-den öň işlemeli. Tema diňe enjamyň OS sazlamasyndan. -->
    <script>
      (function () {
        try {
          var d = matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', d);
          var l = localStorage.getItem('shapak-lang') || 'tk';
          document.documentElement.setAttribute('lang', l);
        } catch (e) {}
      })();
    </script>

    <!-- GitHub Pages SPA: 404.html-den gelen ýoly dikeldýär -->
    <script>
      (function () {
        var r = new URLSearchParams(window.location.search).get('redirect');
        if (r) history.replaceState(null, '', r);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,340;9..144,440;9..144,560;9..144,650&family=Manrope:wght@400;500;600;700;800&display=swap"
